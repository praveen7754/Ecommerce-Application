name: AWS ECR Push Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecommerce-test
  AWS_ACCOUNT_ID: "743320495203"

jobs:
  ecr-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743320495203:role/GitHubActions-Ecommerce
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create test Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM nginx:alpine
          RUN echo "Ecommerce CI/CD ECR Test" > /usr/share/nginx/html/index.html
          EOF

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:latest .

      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Push image to ECR
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --region $AWS_REGION
