name: AWS OIDC Claims Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Read GitHub OIDC claims
        shell: bash
        run: |
          set -e

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python - "$PAYLOAD" <<'PY'
          import sys
          import base64
          import json

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          data = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          print("======================================")
          print("GitHub OIDC CLAIMS")
          print("======================================")
          print("sub              =", data.get("sub"))
          print("aud              =", data.get("aud"))
          print("repository       =", data.get("repository"))
          print("repository_owner =", data.get("repository_owner"))
          print("repository_id    =", data.get("repository_id"))
          print("owner_id         =", data.get("repository_owner_id"))
          print("ref              =", data.get("ref"))
          print("event_name       =", data.get("event_name"))
          print("job_workflow_ref =", data.get("job_workflow_ref"))
          print("environment      =", data.get("environment"))
          print("======================================")
          PY
